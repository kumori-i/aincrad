# V2 PROPOSAL ONLY. Local source preparation is not publication/run approval.
# Publishing the reviewed copy at .github/workflows/owner-hosted-qualification.yml
# on proof/owner-hosted-qualification-v2 starts SETUP QUALIFICATION immediately.
# First create that branch at baseline 184064bb125fc103efe474779bcae949d5ab5d69
# whose v1 workflow does not match this v2 branch; then push the reviewed commit. Both
# pushes also trigger existing check/build. No PR is needed. No reset/retry is approved.
# Publication/execution need separate exact-source approval. No timing is present.
name: Hosted display qualification v2 only
on:
  push:
    branches: ['proof/owner-hosted-qualification-v2']
permissions:
  contents: read
concurrency:
  group: aincrad-hosted-qualification-v2-only
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'kumori-i/aincrad' && github.ref == 'refs/heads/proof/owner-hosted-qualification-v2' && github.run_attempt == 1 && github.event.before == '184064bb125fc103efe474779bcae949d5ab5d69' && github.event.after == github.sha && github.event.created == false && github.event.deleted == false && github.event.forced == false && github.event.repository.full_name == 'kumori-i/aincrad' && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - name: Check out this approved publication commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify existing host prerequisites and reviewed source
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: >-
          node prototype/owner-proof/hosted-qualification/qualify.mjs
          --preflight
          --expected-manifest=52c7617df1e9414aa615adc9552d2693fa8f3945b1b770ce5174890e0a4a3409
          --expected-commit="$EXPECTED_COMMIT"
      - name: Install only existing lockfile dependencies
        shell: bash
        run: |
          set -euo pipefail
          logfile="$RUNNER_TEMP/aincrad-qualification-npm-ci.log"
          if ! timeout --kill-after=5s 180s npm ci --no-audit --no-fund --loglevel=error >"$logfile" 2>&1; then
            printf '%s\n' 'QUALIFICATION_UNAVAILABLE lockfile-install-failed'
            printf 'INSTALL_LOG_BYTES '; wc -c <"$logfile"
            printf 'INSTALL_LOG_SHA256 '; sha256sum "$logfile" | cut -d' ' -f1
            exit 1
          fi
          printf '%s\n' 'LOCKFILE_INSTALL completed'
      - name: Run deterministic qualification boundary tests
        shell: bash
        run: node --test prototype/owner-proof/hosted-qualification/qualification.test.mjs
      - name: Qualify one isolated Xvfb and sandboxed Electron window
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: >-
          node prototype/owner-proof/hosted-qualification/qualify.mjs
          --qualify
          --expected-manifest=52c7617df1e9414aa615adc9552d2693fa8f3945b1b770ce5174890e0a4a3409
          --expected-commit="$EXPECTED_COMMIT"
