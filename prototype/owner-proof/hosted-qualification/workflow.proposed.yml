# PROPOSAL ONLY. This file is intentionally outside .github/workflows.
# Publishing the reviewed copy at .github/workflows/owner-hosted-qualification.yml
# on proof/owner-hosted-qualification starts SETUP QUALIFICATION immediately.
# First create that branch at baseline 1f20f401f720b61069dcea06d10cc4e885e0b1f6
# without this workflow; then push the exact reviewed setup commit once. Both
# pushes also trigger existing check/build. No PR is needed. No reset/retry is approved.
# Publication/execution need separate exact-source approval. No timing is present.
name: Hosted display qualification only
on:
  push:
    branches: ['proof/owner-hosted-qualification']
permissions:
  contents: read
concurrency:
  group: aincrad-hosted-qualification-only
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'kumori-i/aincrad' && github.ref == 'refs/heads/proof/owner-hosted-qualification' && github.run_attempt == 1 && github.event.before == '1f20f401f720b61069dcea06d10cc4e885e0b1f6' && github.event.after == github.sha && github.event.created == false && github.event.deleted == false && github.event.forced == false && github.event.repository.full_name == 'kumori-i/aincrad' && github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - name: Check out this approved publication commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify existing host prerequisites and reviewed source
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: >-
          node prototype/owner-proof/hosted-qualification/qualify.mjs
          --preflight
          --expected-manifest=d32cc4093e8956b4e26c47599ea4dcd1cc42baebd2d8e50fa56d7136de19cad6
          --expected-commit="$EXPECTED_COMMIT"
      - name: Install only existing lockfile dependencies
        shell: bash
        run: |
          set -euo pipefail
          logfile="$RUNNER_TEMP/aincrad-qualification-npm-ci.log"
          if ! timeout --kill-after=5s 180s npm ci --no-audit --no-fund --loglevel=error >"$logfile" 2>&1; then
            printf '%s\n' 'QUALIFICATION_UNAVAILABLE lockfile-install-failed'
            printf 'INSTALL_LOG_BYTES '; wc -c <"$logfile"
            printf 'INSTALL_LOG_SHA256 '; sha256sum "$logfile" | cut -d' ' -f1
            exit 1
          fi
          printf '%s\n' 'LOCKFILE_INSTALL completed'
      - name: Run deterministic qualification boundary tests
        shell: bash
        run: node --test prototype/owner-proof/hosted-qualification/qualification.test.mjs
      - name: Qualify one isolated Xvfb and sandboxed Electron window
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: >-
          node prototype/owner-proof/hosted-qualification/qualify.mjs
          --qualify
          --expected-manifest=d32cc4093e8956b4e26c47599ea4dcd1cc42baebd2d8e50fa56d7136de19cad6
          --expected-commit="$EXPECTED_COMMIT"
