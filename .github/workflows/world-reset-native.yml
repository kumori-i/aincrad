name: World reset native acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/world-reset-native.yml'
      - 'src/**'
      - 'desktop/**'
      - 'scripts/*reset*'
      - 'scripts/*dialog*'
      - 'scripts/build.mjs'
      - 'scripts/native-capture-readiness.mjs'
      - 'scripts/carcass-native-contract.mjs'
      - 'tests/*reset*'
      - 'tests/current-world-backup.test.mjs'
      - 'index.html'
      - 'style.css'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-reset:
    name: Reset and backup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AINCRAD_NATIVE_DIALOG_CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Record actual host and source
        run: node scripts/record-native-host.mjs
      - run: npm ci
      - name: Install Linux desktop and native dialog input tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox xdotool imagemagick
      - name: Verify Linux reset, real backup chooser, and independent reopen
        if: runner.os == 'Linux'
        run: xvfb-run -a bash -c 'openbox > "$RUNNER_TEMP/aincrad-reset-openbox.log" 2>&1 & node scripts/verify-world-reset-desktop.mjs'
      - name: Verify macOS reset, real backup chooser, and independent reopen
        if: runner.os == 'macOS'
        run: node scripts/verify-world-reset-desktop.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-reset-native-${{ runner.os }}-${{ runner.arch }}
          path: |
            test-results/host.json
            test-results/world-reset-desktop/
          if-no-files-found: warn
          retention-days: 7
