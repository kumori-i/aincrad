name: Verify isolated pixel language lab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pixel-lab-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded CPU-only research dependencies
        run: |
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Validate renderer, reward learning, isolation, and artifact contracts
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python -m unittest scripts.pixel_language_lab.test_lab -v
