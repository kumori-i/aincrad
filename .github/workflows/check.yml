name: Verify world
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rules-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and run deterministic checks
        run: npm run check
      - name: Build internal desktop assets
        run: npm run build
