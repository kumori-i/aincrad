name: Verify world
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rules-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and run deterministic checks
        run: npm run check
      - name: Rebuild offline game
        run: npm run bundle
      - name: Check that the committed offline build is current
        run: git diff --exit-code -- play.html
      - uses: actions/upload-artifact@v4
        with:
          name: aincrad-offline-game
          path: play.html
