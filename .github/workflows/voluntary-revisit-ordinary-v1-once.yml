name: Voluntary revisit ordinary v1 approved once
on: create
permissions:
  contents: read
  actions: read
jobs:
  pair:
    if: github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref == 'experiments/voluntary-revisit-ordinary-v1-once' && github.ref == 'refs/heads/experiments/voluntary-revisit-ordinary-v1-once' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 135
    strategy:
      fail-fast: false
      matrix:
        pair: [0, 1]
    concurrency:
      group: voluntary-revisit-ordinary-v1-pair-${{ matrix.pair }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: protocol
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0f10bdd3321d87aeafbfd5d2f09095b9b8fb059f
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1fb64ad879ab7155b023f4bb3bc44c6a776204f1
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Local authored contracts only
        working-directory: protocol
        run: node --test tests/revisit-observer-design.test.mjs
      - name: One guarded continuous comparison
        working-directory: protocol
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/revisit-observer/run.mjs --execute-once ${{ matrix.pair }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voluntary-revisit-ordinary-v1-pair-${{ matrix.pair }}
          path: protocol/test-results/voluntary-revisit-ordinary-v1/
          if-no-files-found: warn
          retention-days: 30
