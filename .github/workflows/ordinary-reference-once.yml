name: Ordinary reference acquisition — approved once
# Preparation does not activate this workflow. The reserved ref is created only
# after external exact-commit/protocol approval. No push/PR/dispatch/rerun fallback.
on: create
permissions:
  contents: read
jobs:
  ordinary-once:
    if: github.event.ref_type == 'branch' && github.event.ref == 'experiments/reference-acquisition-v1-once' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Source-only observer contracts
        run: node --test tests/ordinary-reference-protocol.test.mjs
      - name: Sandbox-preserving Linux display
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox
      - name: One approved normal-clock trajectory, never retry
        run: xvfb-run -a bash -c 'openbox >/dev/null 2>&1 & node scripts/prepare-ordinary-reference-desktop.mjs --execute-approved'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ordinary-reference-once-linux-x64
          path: test-results/ordinary-reference/
          if-no-files-found: warn
          retention-days: 7
