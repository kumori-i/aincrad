name: Character message native acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/visual-reference-native.yml'
      - 'src/**'
      - 'desktop/**'
      - 'index.html'
      - 'style.css'
      - 'scripts/visual-reference-native-fixture.mjs'
      - 'scripts/verify-visual-reference-desktop.mjs'
      - 'scripts/build.mjs'
      - 'scripts/record-native-host.mjs'
      - 'scripts/native-capture-readiness.mjs'
      - 'scripts/carcass-native-contract.mjs'
      - 'scripts/structural-movement-native-contract.mjs'
      - 'tests/visual-reference-*.test.mjs'
      - 'tests/character-message-*.test.mjs'
      - 'tests/learning-view.test.mjs'
      - 'tests/visual-indication-action.test.mjs'
      - 'package*.json'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-reference:
    name: Character models, paid response, actual main pixels and reopen (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/record-native-host.mjs
      - run: npm ci
      - name: Causal action, sender-visible response, numeric core, local parser and persistence contracts
        id: focused
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          node --test tests/character-message-*.test.mjs tests/learning-view.test.mjs tests/visual-indication-action.test.mjs tests/visual-reference-*.test.mjs 2>&1 | tee test-results/visual-reference-focused.log
      - name: Install sandbox-preserving Linux display and window manager
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox
      - name: Linux paid sender cue and listener response close/reopen fixtures
        id: native_linux
        if: runner.os == 'Linux'
        run: xvfb-run -a bash -c 'openbox > "$RUNNER_TEMP/aincrad-visual-reference-openbox.log" 2>&1 & node scripts/verify-visual-reference-desktop.mjs && node scripts/verify-visual-reference-desktop.mjs --response-scenario'
      - name: macOS paid sender cue and listener response close/reopen fixtures
        id: native_macos
        if: runner.os == 'macOS'
        run: |
          node scripts/verify-visual-reference-desktop.mjs
          node scripts/verify-visual-reference-desktop.mjs --response-scenario
      - name: Record character-message engineering scope without claiming language acquisition
        if: always()
        shell: bash
        env:
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          LINUX_OUTCOME: ${{ steps.native_linux.outcome }}
          MACOS_OUTCOME: ${{ steps.native_macos.outcome }}
        run: |
          echo "Causal contracts: $FOCUSED_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Native character-message and sender-response fixture: Linux=$LINUX_OUTCOME; macOS=$MACOS_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Two independent disposable profiles are configured to run three native processes each. The default profile retains original actor positions and checks an actual sampled character string, paid sender demonstration, one listener update from original and final own Canvas crops, optional reply censorship when reverse geometry is unavailable, and interruption of a second sampled message during its paid sender cue across close/reopen. The separate fixed historical seed-212 engineering negative control moves only Mira from (300,920) to (230,960) before action so both public gesture directions resolve under the ordinary parser. Its fixed new streams predict a wrong original uniform listener choice. It checks one listener model update and one sender-local actual-Canvas mismatch update after the listener replies with its ORIGINAL choice. Its second full optional exchange saves during the genuinely paid listener response; reopen must retain learned model weights and discard pending authority with no duplicate update. Both fixtures use actual main-population bodies/ecology at 1/60-second steps and supplied pixel pooling/geometry, with bounded decision scheduling when they run. Authored geometry and deliberate actions are engineering checks, not ordinary opportunity evidence, autonomous rates, word meaning, grammar, generalization or survival benefit. Inspect screenshots and parser/permit audits; file size alone is not semantic image review. Only the recorded host architecture is tested." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-reference-native-${{ runner.os }}-${{ runner.arch }}
          path: |
            test-results/host.json
            test-results/visual-reference-focused.log
            test-results/visual-reference-native/
          if-no-files-found: warn
          retention-days: 7
