name: Visual reference association native acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/visual-reference-native.yml'
      - 'src/**'
      - 'desktop/**'
      - 'index.html'
      - 'style.css'
      - 'scripts/visual-reference-native-fixture.mjs'
      - 'scripts/verify-visual-reference-desktop.mjs'
      - 'scripts/build.mjs'
      - 'scripts/record-native-host.mjs'
      - 'scripts/native-capture-readiness.mjs'
      - 'scripts/carcass-native-contract.mjs'
      - 'scripts/structural-movement-native-contract.mjs'
      - 'tests/visual-reference-*.test.mjs'
      - 'tests/visual-indication-action.test.mjs'
      - 'package*.json'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-reference:
    name: Own-demo association, optional response, actual main pixels and reopen (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/record-native-host.mjs
      - run: npm ci
      - name: Causal action, sender-visible response, local parser, private memory and transaction contracts
        id: focused
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          node --test tests/visual-indication-action.test.mjs tests/visual-reference-*.test.mjs 2>&1 | tee test-results/visual-reference-focused.log
      - name: Install sandbox-preserving Linux display and window manager
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox
      - name: Linux paid sender cue and listener response close/reopen fixtures
        id: native_linux
        if: runner.os == 'Linux'
        run: xvfb-run -a bash -c 'openbox > "$RUNNER_TEMP/aincrad-visual-reference-openbox.log" 2>&1 & node scripts/verify-visual-reference-desktop.mjs && node scripts/verify-visual-reference-desktop.mjs --response-scenario'
      - name: macOS paid sender cue and listener response close/reopen fixtures
        id: native_macos
        if: runner.os == 'macOS'
        run: |
          node scripts/verify-visual-reference-desktop.mjs
          node scripts/verify-visual-reference-desktop.mjs --response-scenario
      - name: Record own-demo, response and diagnostic scope without claiming generalization
        if: always()
        shell: bash
        env:
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          LINUX_OUTCOME: ${{ steps.native_linux.outcome }}
          MACOS_OUTCOME: ${{ steps.native_macos.outcome }}
        run: |
          echo "Causal contracts: $FOCUSED_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Native private-association and sender-response fixture: Linux=$LINUX_OUTCOME; macOS=$MACOS_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Two independent disposable profiles are configured to run three native processes each. The default profile retains original actor positions and checks a paid sender demonstration, retained listener learning, optional reply censorship when reverse geometry is unavailable, and interruption of a second paid sender cue across close/reopen. The separate fixed seed-212 engineering negative control moves only Mira from (300,920) to (230,960) before action to make both public gesture directions numerically resolvable under the ordinary parser. It checks a wrong original paid listener choice, subsequent corrective learning, and the sender's actual-Canvas visual mismatch after the listener replies with its ORIGINAL choice. Its second full optional exchange is configured to save and close during the genuinely paid listener response; reopen must retain the association and discard response authority and all session feedback. Both fixtures use actual main-population bodies/ecology at 1/60-second steps and supplied pixel pooling/geometry, with bounded decision scheduling when they run. Authored geometry and deliberate actions are engineering checks, not ordinary opportunity evidence, autonomous rates, language composition, generalization or survival benefit. Inspect screenshots and parser/permit audits; file size alone is not semantic image review. Only the recorded host architecture is tested." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-reference-native-${{ runner.os }}-${{ runner.arch }}
          path: |
            test-results/host.json
            test-results/visual-reference-focused.log
            test-results/visual-reference-native/
          if-no-files-found: warn
          retention-days: 7
