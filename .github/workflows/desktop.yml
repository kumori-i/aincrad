name: Desktop application
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Exercise the Windows desktop window
        if: runner.os == 'Windows'
        run: npm run smoke
      - name: Exercise the Linux desktop window
        if: runner.os == 'Linux'
        # Hosted Ubuntu runners cannot use Electron's downloaded SUID helper.
        # This flag applies only to an isolated smoke process.
        run: npm run smoke -- --no-sandbox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-${{ runner.os }}
          path: test-results/
