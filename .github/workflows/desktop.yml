name: Desktop application
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Record actual native host and architecture
        run: node scripts/record-native-host.mjs
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Exercise the macOS desktop window
        if: runner.os == 'macOS'
        run: npm run smoke
      - name: Verify macOS saved structural departure and paid retreat
        if: runner.os == 'macOS'
        run: node scripts/verify-structural-movement-desktop.mjs
      - name: Verify macOS controller-selected recovery and save interruption
        if: runner.os == 'macOS'
        run: node scripts/verify-movement-recovery-desktop.mjs
      - name: Verify macOS bounded naming follow-up and interrupted save
        if: runner.os == 'macOS'
        run: node scripts/verify-naming-followup-desktop.mjs
      - name: Verify macOS bounded naming repair and interrupted retry
        if: runner.os == 'macOS'
        run: node scripts/verify-naming-repair-desktop.mjs
      - name: Install sandbox-preserving Linux desktop
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox
      - name: Exercise Linux window and saved structural departure
        if: runner.os == 'Linux'
        run: xvfb-run -a bash -c 'openbox > "$RUNNER_TEMP/aincrad-openbox.log" 2>&1 & npm run smoke && node scripts/verify-structural-movement-desktop.mjs && node scripts/verify-movement-recovery-desktop.mjs && node scripts/verify-naming-followup-desktop.mjs && node scripts/verify-naming-repair-desktop.mjs'
      - name: Package Linux for the runner architecture
        if: runner.os == 'Linux'
        run: npm run package:linux
      - name: Package macOS for the runner architecture (unsigned development app)
        if: runner.os == 'macOS'
        run: npm run package:mac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-${{ runner.os }}-${{ runner.arch }}
          path: test-results/
      - name: Archive bundle modes and symlinks
        shell: bash
        run: tar -czf "desktop-package-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz" release/
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-package-${{ runner.os }}-${{ runner.arch }}
          path: desktop-package-*.tar.gz
          if-no-files-found: error
          retention-days: 7
