name: Finite aquatic native QA
on:
  pull_request:
    paths:
      - '.github/workflows/finite-aquatic-native.yml'
      - 'src/**'
      - 'desktop/**'
      - 'scripts/verify-aquatic-desktop.mjs'
      - 'scripts/carcass-native-contract.mjs'
      - 'scripts/peer-teaching-ui-fixture.mjs'
      - 'scripts/method-transfer-ui-fixture.mjs'
      - 'tests/method-transfer-*.test.mjs'
      - 'tests/local-method-transfer.test.mjs'
      - 'index.html'
      - 'style.css'
      - 'scripts/build.mjs'
      - 'scripts/record-native-host.mjs'
      - 'tests/aquatic-*.test.mjs'
      - 'tests/fixtures/finite-fishing.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-aquatic:
    strategy:
      fail-fast: false
      # Bounded sandbox-preserving Linux runner for current native QA. Replace before the runner's announced retirement.
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Record actual native host and architecture
        run: node scripts/record-native-host.mjs
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Install a real Linux test window manager
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox
      - name: Exercise sandboxed Linux capture, rendering, lifecycle and disk reopen
        if: runner.os == 'Linux'
        run: xvfb-run -a bash -c 'openbox > "$RUNNER_TEMP/aincrad-aquatic-openbox.log" 2>&1 & node scripts/verify-aquatic-desktop.mjs'
      - name: Exercise macOS capture, rendering, lifecycle and disk reopen
        if: runner.os == 'macOS'
        run: node scripts/verify-aquatic-desktop.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-aquatic-native-${{ runner.os }}-${{ runner.arch }}
          path: |
            test-results/host.json
            test-results/aquatic-desktop/
          if-no-files-found: warn
          retention-days: 7
  autonomous-diagnostic:
    name: Autonomous fishing diagnostic (nonblocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record fixed current-world autonomous diagnostics (not a physical release gate)
        id: autonomous
        continue-on-error: true
        shell: bash
        env:
          AINCRAD_NATIVE_AQUATIC: '1'
        run: |
          set -euo pipefail
          mkdir -p test-results/aquatic-policy
          node --test --test-name-pattern="predeclared native autonomous local encounter" tests/aquatic-discovery.test.mjs 2>&1 | tee test-results/aquatic-policy/native-policy.log
      - name: Disclose diagnostic outcome without relabeling failure as success
        if: always()
        shell: bash
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.autonomous.outcome }}
        run: |
          echo "Autonomous fishing diagnostic outcome: $DIAGNOSTIC_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "The three fixed 600-second current-world trials are diagnostic only. Historical PR38 v10 failures remain recorded separately because geography changed. Physical, conservation, save, security and sandboxed native checks remain required. A failed diagnostic does not establish autonomous hunting, fishing or survival." >> "$GITHUB_STEP_SUMMARY"
          if [ "$DIAGNOSTIC_OUTCOME" != "success" ]; then
            echo "::warning::Autonomous fishing diagnostic did not pass ($DIAGNOSTIC_OUTCOME); inspect the retained original log. Capability acceptance does not require short-policy success."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-aquatic-native-policy
          path: test-results/aquatic-policy/
          if-no-files-found: warn
          retention-days: 7
