name: Ordinary character-food-run lifecycle v5 — approved once
# This workflow is inert until the reviewed food-run v5 experiment branch is created.
# Receipt data lives on a separate single-file Git ref, outside frozen source.
on: create
permissions:
  contents: read
  actions: read
jobs:
  ordinary-character-food-run-v5-once:
    if: github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref == 'experiments/character-food-run-lifecycle-v5-once' && github.ref == 'refs/heads/experiments/character-food-run-lifecycle-v5-once' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    concurrency:
      group: character-food-run-lifecycle-v5-once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reject any prior activation, including failed or deleted-branch runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/character-food-run-v5-activation-gate.mjs
      - name: Fetch one reviewed receipt from the separate data ref
        run: node scripts/character-food-run-v5-receipt-ref.mjs
      - name: Record actual native host
        run: node scripts/record-native-host.mjs
      - run: npm ci
      - name: Source-only pilot and activation contracts
        run: node --test tests/character-food-run-v5-activation-gate.test.mjs tests/character-food-run-v5-receipt-ref.test.mjs tests/character-ordinary-food-run-v5-protocol.test.mjs tests/character-ordinary-food-run-v5-runner.test.mjs
      - name: Install sandbox-preserving Linux display
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox
      - name: One approved normal-world food-run v5 trajectory, never retry
        run: xvfb-run -a bash -c 'openbox >/dev/null 2>&1 & node scripts/prepare-character-ordinary-food-run-v5.mjs --execute-approved'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-food-run-v5-once-linux-x64
          path: |
            test-results/host.json
            test-results/character-ordinary-food-run-v5/
          if-no-files-found: warn
          retention-days: 7
